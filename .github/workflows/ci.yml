name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      # next-env.d.ts está gitignored, así que en un checkout limpio no existe y con él se
      # pierde el `/// <reference types="next" />`: sin eso desaparece la ampliación de tipos
      # de styled-jsx y todo `<style jsx>` falla. `typegen` lo regenera sin build completo.
      - run: pnpm exec next typegen

      - run: pnpm exec tsc --noEmit

      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
